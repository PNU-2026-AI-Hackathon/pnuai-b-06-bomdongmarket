name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Vercel Production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farmbroker-web/package-lock.json

      - name: Validate deployment secrets
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is not configured" >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is not configured" >&2; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured" >&2; exit 1; }

      - name: Install dependencies
        working-directory: farmbroker-web
        run: npm ci

      - name: Pull Vercel production settings
        run: npx --yes vercel@58.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx --yes vercel@58.4.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          deployment_url="$(npx --yes vercel@58.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $deployment_url"
